<!DOCTYPE html>

        // ===== Level 1: Anstieg und y-Achsenabschnitt ablesen =====

        {

        },

            korrekt: 0,
            tipp: "Berechne \\(m_1 \\cdot m_2\\).",
            loesungsweg: "\\(\\frac{2}{3} \\cdot \\left(-\\frac{3}{2}\\right) = -1\\). Also sind sie senkrecht zueinander."
        },
        {
            id: 24, level: 4, typ: "numerisch",
            frage: "Eine Gerade ist senkrecht zu \\(f(x) = 3x - 2\\) und verläuft durch \\(P(6\\,|\\,1)\\). Wie groß ist \\(n\\)?",
            loesung: 3, toleranz: 0,
            tipp: "Erst senkrechten Anstieg bestimmen, dann Punktprobe.",
            loesungsweg: "\\(m_2 = -\\frac{1}{3}\\). Mit \\(P(6\\,|\\,1)\\): \\(1 = -\\frac{1}{3} \\cdot 6 + n = -2 + n \\Rightarrow n = 3\\)."

        // ===== Level 5: Schnittpunkt zweier Geraden =====
            {

            },
            {

              frage: "Für welchen Wert von \\(m\\) schneiden sich \\(f(x) = mx + 2\\) und \\(g(x) = 3x - 4\\) an der Stelle \\(x = 2\\)?",
              loesung: 0, toleranz: 0.01,
              tipp: "Berechne zuerst, welchen Wert \\(g\\) an der Stelle \\(2\\) hat – dort muss auch \\(f\\) liegen.",
              loesungsweg: "\\(g(2) = 6 - 4 = 2\\). Also muss \\(f(2) = 2\\) gelten: $$2m + 2 = 2 \\Rightarrow m = 0$$ Die Gerade \\(f\\) ist dann die waagerechte Gerade \\(y = 2\\)."
            },
            {
              id: 27, level: 5, typ: "numerisch",
              frage: "Die Gerade \\(f(x) = -2x + 6\\) schließt mit den beiden Koordinatenachsen ein Dreieck ein. Berechne dessen Flächeninhalt.",
              loesung: 9, toleranz: 0.01,
              tipp: "Die Katheten des Dreiecks sind die Abschnitte auf den beiden Achsen.",
              loesungsweg: "Nullstelle: \\(-2x + 6 = 0 \\Rightarrow x = 3\\). \\(y\\)-Achsenabschnitt: \\(f(0) = 6\\). Das rechtwinklige Dreieck hat die Katheten \\(3\\) und \\(6\\): $$A = \\frac{1}{2} \\cdot 3 \\cdot 6 = 9$$"
            },
            {
              id: 28, level: 5, typ: "numerisch",
              frage: "Die Gerade \\(g\\) verläuft durch \\(A(0\\mid1)\\) und \\(B(4\\mid9)\\). Bestimme die \\(x\\)-Koordinate ihres Schnittpunkts mit \\(h(x) = -x + 11\\). Runde auf zwei Dezimalstellen.",
              loesung: 3.33, toleranz: 0.01,
              tipp: "Stelle zuerst die Gleichung von \\(g\\) auf – der Punkt \\(A\\) liegt günstig.",
              loesungsweg: "Steigung: \\(m = \\frac{9-1}{4-0} = 2\\); wegen \\(A(0\\mid1)\\) ist \\(g(x) = 2x + 1\\). Gleichsetzen: $$2x + 1 = -x + 11 \\Rightarrow 3x = 10 \\Rightarrow x = \\frac{10}{3} \\approx 3{,}33$$"
            },
            {
              id: 29, level: 5, typ: "numerisch",
              frage: "Die Gerade \\(h\\) steht senkrecht auf \\(f(x) = 0{,}5x + 3\\) und verläuft durch den Schnittpunkt von \\(f\\) mit der \\(y\\)-Achse. Berechne \\(h(2)\\).",
              loesung: -1, toleranz: 0.01,
              tipp: "Zwei Schritte: erst die Steigung von \\(h\\) aus der Senkrechtbedingung, dann den gemeinsamen Punkt.",
              loesungsweg: "Senkrecht: \\(m_h = -\\frac{1}{0{,}5} = -2\\). Schnittpunkt von \\(f\\) mit der \\(y\\)-Achse: \\((0\\mid3)\\) – dort verläuft auch \\(h\\), also \\(h(x) = -2x + 3\\). $$h(2) = -4 + 3 = -1$$"
            },
        {
            id: 30, level: 5, typ: "mc",
            frage: "Welche Lage haben \\(f(x) = 2x + 3\\) und \\(g(x) = 2x - 5\\) zueinander?",
            optionen: ["Sie schneiden sich in \\(S(0\\,|\\,3)\\)", "Sie sind identisch", "Sie sind parallel, aber nicht identisch", "Sie stehen senkrecht aufeinander"],
            korrekt: 2,
            tipp: "Gleiches \\(m\\), verschiedene \\(n\\).",
            loesungsweg: "Beide haben \\(m = 2\\) (parallel), aber verschiedene \\(n\\) (\\(3\\) und \\(-5\\)). Also parallel, nicht identisch — kein Schnittpunkt."
        },

      // ═══════════════════════════════════════════════════════════
      // LEVEL 6 — Modellieren, Parameter, Begründen
      // ═══════════════════════════════════════════════════════════
      {
        id: 31, level: 6, typ: "numerisch",

        loesungsweg: "\\(K_A(x) = 0{,}8x + 5\\), \\(K_B(x) = 1{,}3x\\). Gleichsetzen: $$0{,}8x + 5 = 1{,}3x \\Rightarrow 5 = 0{,}5x \\Rightarrow x = 10$$ Bis \\(10\\,\\text{GB}\\) ist Tarif B günstiger, ab \\(10\\,\\text{GB}\\) Tarif A – denn A steigt flacher an."
      },
      {
        id: 32, level: 6, typ: "numerisch",
        frage: "Für welchen Wert von \\(b\\) schneiden sich die Geraden \\(f(x) = 2x + b\\) und \\(g(x) = -3x + 5\\) auf der \\(y\\)-Achse?",
        loesung: 5, toleranz: 0,
        tipp: "Welche \\(x\\)-Koordinate hat jeder Punkt auf der \\(y\\)-Achse?",
        loesungsweg: "Auf der \\(y\\)-Achse ist \\(x = 0\\). Dort gilt \\(f(0) = b\\) und \\(g(0) = 5\\). Ein gemeinsamer Punkt entsteht genau dann, wenn $$b = 5$$ Die \\(y\\)-Achsenabschnitte müssen also übereinstimmen."
      },
      {
        id: 33, level: 6, typ: "mc",
        frage: "Warum haben die Geraden \\(f(x) = 3x + 1\\) und \\(g(x) = 3x - 4\\) keinen Schnittpunkt?",
        optionen: [
            "Sie haben dieselbe Steigung, aber verschiedene \\(y\\)-Achsenabschnitte – beim Gleichsetzen entsteht ein Widerspruch",
            "Weil ihre \\(y\\)-Achsenabschnitte verschiedene Vorzeichen haben",
            "Weil beide Steigungen positiv sind",
            "Sie haben einen Schnittpunkt, er liegt nur außerhalb des sichtbaren Bereichs"

        korrekt: 0,
        tipp: "Setze die beiden Terme gleich und schau, was passiert.",

      },
      {

        frage: "Ein Zug fährt mit gleichbleibender Geschwindigkeit. Nach \\(2\\) Stunden hat er \\(40\\,\\text{km}\\) vom Startbahnhof zurückgelegt, nach \\(6\\) Stunden \\(70\\,\\text{km}\\). Wie weit war er zum Zeitpunkt \\(t = 0\\) vom Startbahnhof entfernt?",
        loesung: 25, toleranz: 0.01,
        tipp: "Bestimme zuerst die Geschwindigkeit als Steigung und dann den Anfangswert.",
        loesungsweg: "Steigung: $$m = \\frac{70 - 40}{6 - 2} = 7{,}5 \\;\\text{km/h}$$ Einsetzen von \\((2 \\mid 40)\\): \\(40 = 7{,}5 \\cdot 2 + c \\Rightarrow c = 25\\). Der Zug war zu Beginn bereits \\(25\\,\\text{km}\\) entfernt."
      },
      {
        id: 35, level: 6, typ: "mc",
        frage: "Ein Schüler bestimmt die Gerade durch \\(A(1\\mid3)\\) und \\(B(4\\mid9)\\):<br>Schritt 1: \\(m = \\frac{9 - 3}{4 - 1} = 2\\)<br>Schritt 2: \\(y = 2x + 3\\), denn \\(A\\) hat den \\(y\\)-Wert \\(3\\)<br>Welcher Schritt ist der erste fehlerhafte?",
        optionen: ["Schritt 1", "Schritt 2", "Beide Schritte sind falsch", "Kein Schritt ist fehlerhaft"],
        korrekt: 1,
        tipp: "Prüfe, ob der Punkt \\(A\\) die aufgestellte Gleichung wirklich erfüllt.",
        loesungsweg: "Die Steigung in Schritt 1 stimmt. In Schritt 2 wird der \\(y\\)-Wert von \\(A\\) fälschlich als \\(y\\)-Achsenabschnitt verwendet – das gilt nur für Punkte <b>auf</b> der \\(y\\)-Achse. Richtig: Einsetzen von \\(A\\) in \\(y = 2x + b\\) ergibt $$3 = 2 + b \\Rightarrow b = 1$$ also \\(y = 2x + 1\\). Probe mit \\(B\\): \\(2 \\cdot 4 + 1 = 9\\) ✓."
      },
      {

        frage: "Eine Kerze brennt gleichmäßig ab. Nach \\(2\\) Stunden ist sie \\(18\\,\\text{cm}\\) lang, nach \\(5\\) Stunden \\(12\\,\\text{cm}\\). Nach wie vielen Stunden ist sie vollständig abgebrannt?",

        tipp: "Stelle die Längenfunktion auf und bestimme ihre Nullstelle.",
        loesungsweg: "Abbrandgeschwindigkeit: $$m = \\frac{12 - 18}{5 - 2} = -2 \\;\\text{cm/h}$$ Anfangslänge aus \\((2 \\mid 18)\\): \\(18 = -2 \\cdot 2 + c \\Rightarrow c = 22\\). Also \\(L(t) = -2t + 22\\). Nullstelle: $$-2t + 22 = 0 \\Rightarrow t = 11$$ Nach \\(11\\) Stunden ist die Kerze abgebrannt."

    ];
