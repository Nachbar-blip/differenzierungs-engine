<!DOCTYPE html>

<head>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-pot-ganzzahlige-exp';
    const THEMA_CONFIG = { name: 'Potenzfunktionen (ganzz. Exp.)', bereich: 'analysis', p3Enabled: true };
    const AUFGABEN = [

    // ═══════════════════════════════════════════════════════════════

    },
    {

        frage: "Schreibe \\(x^{-3}\\) als Bruch.",
        optionen: ["\\(\\frac{1}{x^3}\\)", "\\(\\frac{3}{x}\\)", "\\(-x^3\\)", "\\(\\frac{1}{3x}\\)"],

    {

        frage: "Wie lautet \\(2x^{-1}\\) als Bruch?",

        korrekt: 1,

    },
    {

    {

            "\\(x^{-5} = \\frac{1}{x^5}\\)",

    },
    {

    {

        frage: "Berechne \\(f(-1)\\) für \\(f(x) = \\frac{1}{x^4}\\).",
        loesung: 1,
        toleranz: 0,
        tipp: "\\((-1)^4 = 1\\), weil der Exponent gerade ist.",
        loesungsweg: "\\(f(-1) = \\frac{1}{(-1)^4} = \\frac{1}{1} = 1\\)."
    },

    // ═══════════════════════════════════════════════════════════════

    },

        frage: "Welcher Ausdruck ist gleich \\(x^{-2} \\cdot x^{-3}\\)?",
        optionen: [
            "\\(\\frac{1}{x^5}\\)",
            "\\(\\frac{1}{x^6}\\)",
            "\\(x^{5}\\)",
            "\\(\\frac{1}{x^{-5}}\\)"

        korrekt: 0,
        tipp: "Erst Exponenten addieren, dann in Bruchschreibweise umformen.",
        loesungsweg: "\\(x^{-2} \\cdot x^{-3} = x^{-5} = \\frac{1}{x^5}\\)."
    },

      {

            "Weil man \\(x^{-2}\\) gar nicht umformen darf",
            "Es ist richtig, solange \\(x > 0\\) ist"
        ],
        korrekt: 0,
        tipp: "Setze \\(x = 2\\) in beide Terme ein und vergleiche.",

      },
      {
        id: 22, level: 4, typ: "numerisch",
        frage: "Löse die Gleichung \\(3 \\cdot 2^{-x} = 0{,}75\\).",
        loesung: 2, toleranz: 0.01,
        tipp: "Isoliere zuerst die Potenz und schreibe die rechte Seite als Bruch.",
        loesungsweg: "$$3 \\cdot 2^{-x} = 0{,}75 \\Rightarrow 2^{-x} = 0{,}25 = \\frac{1}{4} = 2^{-2}$$ Vergleich der Exponenten: \\(-x = -2\\), also \\(x = 2\\)."
      },
      {
        id: 23, level: 4, typ: "numerisch",
        frage: "Der Graph von \\(f(x) = a \\cdot x^{-2}\\) verläuft durch den Punkt \\(P(2 \\mid 3)\\). Bestimme \\(a\\).",
        loesung: 12, toleranz: 0.01,
        tipp: "Setze die Koordinaten des Punktes in die Funktionsgleichung ein.",
        loesungsweg: "$$f(2) = a \\cdot 2^{-2} = \\frac{a}{4} = 3 \\Rightarrow a = 12$$ Die Funktion lautet \\(f(x) = \\frac{12}{x^2}\\)."
      },
      {
        id: 24, level: 4, typ: "mc",
        frage: "Vereinfache: \\(\\dfrac{6x^{-2} \\cdot x^3}{3x}\\)",
        optionen: ["\\(2\\)", "\\(2x\\)", "\\(2x^{-2}\\)", "\\(\\frac{2}{x}\\)"],
        korrekt: 0,
        tipp: "Fasse zuerst den Zähler zusammen – die Exponenten werden dabei addiert.",
        loesungsweg: "Zähler: \\(6x^{-2} \\cdot x^3 = 6x^{1}\\). Damit $$\\frac{6x}{3x} = 2$$ Die Variablen kürzen sich vollständig weg."
      },

    // ═══════════════════════════════════════════════════════════════
    // Level 5: Gleichungen lösen und komplexe Termvereinfachungen
    // ═══════════════════════════════════════════════════════════════

    {
        id: 25, level: 5, typ: "numerisch",
        frage: "Löse: \\(x^{-2} = \\frac{1}{9}\\). Gib eine positive Lösung an.",
        loesung: 3,
        toleranz: 0,
        tipp: "Schreibe \\(x^{-2} = \\frac{1}{x^2}\\) und löse \\(x^2 = 9\\).",
        loesungsweg: "\\(x^{-2} = \\frac{1}{x^2} = \\frac{1}{9}\\) ergibt \\(x^2 = 9\\), also \\(x = 3\\) (positive Lösung)."
    },
    {
        id: 26, level: 5, typ: "numerisch",
        frage: "Löse: \\(2x^{-1} = 8\\). Gib den Wert von \\(x\\) an.",
        loesung: 0.25,
        toleranz: 0.001,
        tipp: "Schreibe \\(\\frac{2}{x} = 8\\) und löse nach \\(x\\) auf.",
        loesungsweg: "\\(\\frac{2}{x} = 8 \\Rightarrow x = \\frac{2}{8} = \\frac{1}{4} = 0{,}25\\)."
    },
    {
        id: 27, level: 5, typ: "mc",
        frage: "Vereinfache vollständig: \\(\\frac{(x^2)^{-3} \\cdot x^4}{x^{-2}}\\).",
        optionen: ["\\(x^{0} = 1\\)", "\\(x^{-2}\\)", "\\(x^{2}\\)", "\\(x^{-8}\\)"],
        korrekt: 0,
        tipp: "Schritt 1: \\((x^2)^{-3} = x^{-6}\\). Dann Exponenten im Zähler addieren, danach dividieren.",
        loesungsweg: "Schritt 1: \\((x^2)^{-3} = x^{-6}\\). Schritt 2 (Zähler): \\(x^{-6} \\cdot x^4 = x^{-2}\\). Schritt 3 (Division): \\(\\frac{x^{-2}}{x^{-2}} = x^{-2-(-2)} = x^{0} = 1\\)."
    },
    {
        id: 28, level: 5, typ: "mc",
        frage: "Löse die Gleichung \\(x^{-3} = -\\frac{1}{27}\\).",
        optionen: ["\\(x = 3\\)", "\\(x = -3\\)", "\\(x = \\frac{1}{3}\\)", "keine Lösung"],
        korrekt: 1,
        tipp: "Schreibe \\(\\frac{1}{x^3} = -\\frac{1}{27}\\). Welches \\(x^3\\) ergibt \\(-27\\)?",
        loesungsweg: "\\(\\frac{1}{x^3} = -\\frac{1}{27} \\Rightarrow x^3 = -27 \\Rightarrow x = -3\\)."
    },
    {
        id: 29, level: 5, typ: "mc",
        frage: "Vereinfache: \\(\\left(\\frac{x^{-2}}{y^3}\\right)^{-1}\\).",
        optionen: [
            "\\(\\frac{x^2}{y^3}\\)",
            "\\(\\frac{y^3}{x^2}\\)",
            "\\(x^2 y^3\\)",
            "\\(\\frac{x^{-2}}{y^{-3}}\\)"
        ],
        korrekt: 2,
        tipp: "Exponent \\(-1\\) bedeutet Kehrwert bilden: Zähler und Nenner tauschen, dann Vorzeichen der Exponenten wechseln.",
        loesungsweg: "\\(\\left(\\frac{x^{-2}}{y^3}\\right)^{-1} = \\frac{y^3}{x^{-2}} = y^3 \\cdot x^{2} = x^2 y^3\\)."
    },
    {
        id: 30, level: 5, typ: "numerisch",
        frage: "Berechne: \\(\\frac{4^{-2} \\cdot 4^5}{4^2}\\). Gib den Exponenten der Viererpotenz als ganze Zahl an.",
        loesung: 1,
        toleranz: 0,
        tipp: "Zähler: Exponenten addieren. Dann vom Nenner subtrahieren.",
        loesungsweg: "\\(4^{-2} \\cdot 4^5 = 4^{3}\\). Dann: \\(\\frac{4^3}{4^2} = 4^{3-2} = 4^1\\). Exponent = 1."
    },

      // ═══════════════════════════════════════════════════════════
      // LEVEL 6 — Parameter aus Punkten, Eigenschaften begründen
      // ═══════════════════════════════════════════════════════════
      {
        id: 31, level: 6, typ: "numerisch",
        frage: "Der Graph von \\(f(x) = a \\cdot x^{-n}\\) verläuft durch \\(P(1 \\mid 8)\\) und \\(Q(2 \\mid 2)\\). Bestimme \\(n\\).",
        loesung: 2, toleranz: 0.01,
        tipp: "Der erste Punkt liefert \\(a\\) sofort – setze dann den zweiten ein.",
        loesungsweg: "Aus \\(f(1) = a \\cdot 1 = 8\\) folgt \\(a = 8\\). Zweiter Punkt: $$\\frac{8}{2^n} = 2 \\Rightarrow 2^n = 4 \\Rightarrow n = 2$$ Die Funktion lautet \\(f(x) = \\frac{8}{x^2}\\)."
      },
      {
        id: 32, level: 6, typ: "numerisch",
        frage: "Für ein Gas gilt bei konstanter Temperatur \\(p \\cdot V = 120\\). Um welchen Faktor ändert sich der Druck, wenn das Volumen verdreifacht wird? Runde auf zwei Dezimalstellen.",
        loesung: 0.33, toleranz: 0.01,
        tipp: "Drücke den Druck als Funktion des Volumens aus und vergleiche \\(p(3V)\\) mit \\(p(V)\\).",
        loesungsweg: "$$p(V) = \\frac{120}{V} \\Rightarrow p(3V) = \\frac{120}{3V} = \\frac{1}{3} \\cdot p(V)$$ Der Druck sinkt also auf ein Drittel (Faktor \\(\\approx 0{,}33\\)) – das gilt unabhängig vom Ausgangsvolumen und ist gerade die umgekehrte Proportionalität."
      },
      {
        id: 33, level: 6, typ: "mc",
        frage: "Welche Aussage über \\(f(x) = \\dfrac{a}{x^n}\\) mit \\(a > 0\\) und geradem \\(n\\) trifft zu?",
        optionen: [
            "Der Graph ist achsensymmetrisch zur \\(y\\)-Achse und verläuft ganz oberhalb der \\(x\\)-Achse",
            "Der Graph ist punktsymmetrisch zum Ursprung",
            "Der Graph schneidet die \\(x\\)-Achse genau einmal",
            "Die Funktion ist auch an der Stelle \\(0\\) definiert"
        ],
        korrekt: 0,
        tipp: "Prüfe \\(f(-x)\\) und überlege, welches Vorzeichen \\(x^n\\) bei geradem \\(n\\) hat.",

      },
      {
        id: 34, level: 6, typ: "numerisch",
        frage: "Für welchen Wert von \\(x\\) gilt \\(2^{x} = \\dfrac{1}{32}\\)?",
        loesung: -5, toleranz: 0.01,
        tipp: "Schreibe die rechte Seite als Zweierpotenz mit negativem Exponenten.",
        loesungsweg: "$$\\frac{1}{32} = \\frac{1}{2^5} = 2^{-5}$$ Vergleich der Exponenten bei gleicher Basis: \\(x = -5\\)."
      },
      {
        id: 35, level: 6, typ: "numerisch",
        frage: "Zwei Größen sind umgekehrt proportional: Zu \\(x = 4\\) gehört \\(y = 15\\). Welcher Wert gehört zu \\(x = 10\\)?",
        loesung: 6, toleranz: 0.01,
        tipp: "Bei umgekehrter Proportionalität ist das Produkt \\(x \\cdot y\\) konstant.",
        loesungsweg: "Produkt: \\(4 \\cdot 15 = 60\\). Also \\(y = \\frac{60}{x}\\) und $$y(10) = \\frac{60}{10} = 6$$ In Potenzschreibweise: \\(y = 60 \\cdot x^{-1}\\)."
      },
      {
        id: 36, level: 6, typ: "mc",
        frage: "Warum gilt \\(a^0 = 1\\) für jedes \\(a \\neq 0\\)?",
        optionen: [
            "Weil \\(a^0 = a^{n-n} = \\frac{a^n}{a^n} = 1\\) – es folgt zwingend aus der Divisionsregel",
            "Weil man das so festgelegt hat, ohne Begründung",
            "Weil jede Zahl mit null multipliziert eins ergibt",
            "Weil \\(a^0\\) gar nicht definiert ist"
        ],
        korrekt: 0,
        tipp: "Wende die Regel \\(\\frac{a^m}{a^n} = a^{m-n}\\) auf den Fall \\(m = n\\) an.",
        loesungsweg: "Die Divisionsregel liefert für \\(m = n\\): $$\\frac{a^n}{a^n} = a^{n-n} = a^0$$ Der Bruch links ist offensichtlich \\(1\\) (für \\(a \\neq 0\\)), also muss \\(a^0 = 1\\) gelten. Die Festlegung ist damit nicht willkürlich, sondern die einzige, bei der die Potenzgesetze widerspruchsfrei bleiben. Für \\(a = 0\\) versagt das Argument – \\(0^0\\) bleibt undefiniert."
      }


    ];
    </script>
