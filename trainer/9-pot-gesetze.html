        id: 23,
        level: 4,
        typ: "mc",

        optionen: ["\\(\\dfrac{8a^6}{b^9}\\)", "\\(\\dfrac{8a^5}{b^6}\\)", "\\(\\dfrac{6a^6}{b^9}\\)", "\\(\\dfrac{2a^6}{b^9}\\)"],

      },
      {

      },
      {

        frage: "Vereinfache \\(\\dfrac{\\left(x^{n+1}\\right)^2 \\cdot x^{-n}}{x^{n+2}}\\) und gib den Exponenten des Ergebnisses an.",

        tipp: "Klammer auflösen (Exponenten multiplizieren), dann im Zähler addieren und zum Schluss subtrahieren.",
        loesungsweg: "Zähler: \\(\\left(x^{n+1}\\right)^2 \\cdot x^{-n} = x^{2n+2} \\cdot x^{-n} = x^{n+2}\\). Division: $$\\frac{x^{n+2}}{x^{n+2}} = x^0$$ Der Exponent ist \\(0\\), der Term also konstant \\(1\\)."
