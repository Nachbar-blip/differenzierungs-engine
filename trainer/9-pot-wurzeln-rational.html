      // ========== LEVEL 1 — babyleicht (6 Aufgaben) ==========

      },
      {

        frage: "Welcher Wert ist \\(\\sqrt{-4}\\) im Bereich der reellen Zahlen?",

        level: 2,

        tipp: "Welche Zahl hoch 3 ergibt 8?",
        loesungsweg: "Wegen \\(2^3 = 8\\) gilt: $$\\sqrt[3]{8} = 2$$"
      },
      {
        id: 9,
        level: 2,
        typ: "mc",
        frage: "Was bedeutet die \\(n\\)-te Wurzel \\(\\sqrt[n]{a}\\)?",
        optionen: [
          "Die Zahl, die mit \\(n\\) multipliziert \\(a\\) ergibt",
