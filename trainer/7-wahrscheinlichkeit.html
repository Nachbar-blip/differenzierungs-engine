    <div class="spirale-container" id="app"></div>

        {
            id: 23, level: 4, typ: "mc",
            frage: "Du würfelst einmal. \\(P(\\text{Augenzahl} \\leq 4) = \\frac{4}{6}\\). Wie groß ist \\(P(\\text{Augenzahl} > 4)\\)?",

      // ═══════════════════════════════════════════════════════════

      {
        id: 25, level: 5, typ: "numerisch",
        frage: "In einer Urne sollen \\(12\\) Kugeln liegen; die Wahrscheinlichkeit, eine rote zu ziehen, soll \\(\\frac{1}{3}\\) betragen. Wie viele rote Kugeln müssen es sein?",

      {

        frage: "Ein Würfel wird \\(600\\)-mal geworfen. Wie viele Sechsen erwartet man?",

        korrekt: 0,
        tipp: "Welche Gleichheit muss vorliegen, damit man mit der Laplace-Regel rechnen darf?",

      },
      {
        id: 32, level: 6, typ: "numerisch",
        frage: "Bei einem Spiel würfelt man einmal: Bei einer Sechs gewinnt man \\(5\\,€\\), sonst zahlt man \\(1\\,€\\). Wie groß ist der durchschnittliche Gewinn pro Spiel in Euro?",

        tipp: "Gewichte Gewinn und Verlust mit ihren Wahrscheinlichkeiten.",
        loesungsweg: "$$\\frac{1}{6} \\cdot 5 + \\frac{5}{6} \\cdot (-1) = \\frac{5}{6} - \\frac{5}{6} = 0$$ Auf lange Sicht gewinnt und verliert man gleich viel – das Spiel ist <b>fair</b>. Bei \\(4\\,€\\) Gewinn wäre es zum Nachteil des Spielers."

      {

        optionen: [
