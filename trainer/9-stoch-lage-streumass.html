<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-lage-streumass';
    const THEMA_CONFIG = { name: 'Lage- und Streumaße', bereich: 'stochastik', p3Enabled: true };
    const AUFGABEN = [

      // ═══════════════════════════════════════════════════════════
      // Level 1 — Arithmetisches Mittel, Median, Modalwert (kurze Listen)

      {

      {
        id: 25, level: 5, typ: "numerisch",
        frage: "Vier Klausuren haben den Mittelwert \\(11\\). Drei davon lauten \\(9\\), \\(12\\) und \\(14\\). Wie lautet die vierte?",
        loesung: 9, toleranz: 0.01,
        tipp: "Aus dem Mittelwert lässt sich die Gesamtsumme aller Werte zurückrechnen.",
        loesungsweg: "Gesamtsumme: \\(4 \\cdot 11 = 44\\). Bekannte Summe: \\(9 + 12 + 14 = 35\\). $$x_4 = 44 - 35 = 9$$"
      },
      {
        id: 26, level: 5, typ: "numerisch",
        frage: "Eine Datenreihe hat die Standardabweichung \\(s = 4\\). Zu jedem Wert werden \\(10\\) addiert. Wie groß ist die Standardabweichung danach?",

      },
      {

        optionen: [
            "Die Durchschnittsleistung ist gleich; in Gruppe B liegen die Einzelergebnisse aber deutlich weiter auseinander",
            "Gruppe A hat insgesamt besser abgeschnitten",
            "Gruppe B hat insgesamt besser abgeschnitten",

        korrekt: 0,

      },
      {
        id: 28, level: 5, typ: "numerisch",
        frage: "Berechne die Standardabweichung der Werte \\(2,\\ 4,\\ 6,\\ 8\\). Runde auf zwei Dezimalstellen.",

        tipp: "Was passiert mit den Abständen zum Mittelwert, wenn alle Werte mit demselben Faktor multipliziert werden?",

      {

        frage: "Die Gehälter einer kleinen Firma betragen \\(1800,\\ 1900,\\ 2000,\\ 2100,\\ 2200\\) und \\(20\\,000\\) Euro. Welche Kennzahl beschreibt das „typische\" Gehalt am besten?",
        optionen: [
            "Der Median, weil er vom einzelnen Extremwert kaum beeinflusst wird",
            "Das arithmetische Mittel, weil es alle Werte berücksichtigt",
            "Die Spannweite, weil sie den Bereich angibt",
            "Der größte Wert, weil er das Gehaltsniveau zeigt"
        ],
        korrekt: 0,
        tipp: "Berechne beide Lagemaße und vergleiche sie mit den tatsächlichen Gehältern.",
        loesungsweg: "Mittelwert: \\(\\frac{30\\,000}{6} = 5000\\,€\\) – mehr als doppelt so viel, wie fünf der sechs Beschäftigten verdienen. Median: \\(\\frac{2000 + 2100}{2} = 2050\\,€\\) – das trifft die Gehaltsstruktur. Der Median ist robust gegenüber Ausreißern, das arithmetische Mittel nicht."
      },
      {
        id: 32, level: 6, typ: "numerisch",
        frage: "Die Datenreihe \\(4,\\ 5,\\ 6,\\ 7,\\ 8\\) hat den Mittelwert \\(6\\). Ersetzt man die \\(8\\) durch \\(800\\), um wie viel steigt dann der Mittelwert?",

        tipp: "Berechne den neuen Mittelwert und bilde die Differenz zum alten.",

      },
      {
        id: 33, level: 6, typ: "mc",
        frage: "Ein Schüler bestimmt den Median von \\(3,\\ 5,\\ 8,\\ 9\\) als \\(8\\), „weil das der mittlere Wert ist\". Was ist dazu zu sagen?",
        optionen: [
            "Falsch – bei gerader Anzahl ist der Median der Mittelwert der beiden mittleren Werte, hier \\(6{,}5\\)",
            "Richtig, \\(8\\) steht in der Mitte",
            "Falsch, der Median ist \\(5\\)",
            "Bei gerader Anzahl gibt es keinen Median"
        ],
        korrekt: 0,
        tipp: "Wie viele Werte liegen bei der Wahl \\(8\\) links davon, wie viele rechts?",
        loesungsweg: "Bei \\(n = 4\\) gibt es keinen einzelnen mittleren Wert. Der Median ist der Mittelwert der beiden mittleren: $$\\tilde{x} = \\frac{5 + 8}{2} = 6{,}5$$ Mit \\(8\\) lägen drei Werte unterhalb und nur einer darüber – die Hälfte-Hälfte-Eigenschaft wäre verletzt."
      },
      {
        id: 34, level: 6, typ: "numerisch",
        frage: "Eine Datenreihe aus fünf Werten hat den Mittelwert \\(12\\). Vier Werte lauten \\(10,\\ 11,\\ 13,\\ 14\\). Wie groß ist die Spannweite der vollständigen Reihe?",
        loesung: 4, toleranz: 0.01,
        tipp: "Bestimme zuerst den fehlenden Wert über die Summe.",
        loesungsweg: "Gesamtsumme: \\(5 \\cdot 12 = 60\\); bekannte Summe: \\(48\\). Der fehlende Wert ist \\(12\\). Die Reihe lautet \\(10, 11, 12, 13, 14\\): $$\\text{Spannweite} = 14 - 10 = 4$$"
      },
      {
        id: 35, level: 6, typ: "mc",
        frage: "In einer Datenreihe wird ein einzelner Wert durch einen sehr viel größeren ersetzt. Welche Kennzahl ändert sich am wenigsten?",
        optionen: [
            "der Median",
            "das arithmetische Mittel",
            "die Spannweite",
            "die Standardabweichung"
        ],
        korrekt: 0,
        tipp: "Welche Kennzahl benutzt überhaupt die Größe der einzelnen Werte, und welche nur ihre Reihenfolge?",
        loesungsweg: "Der Median hängt nur von der <b>Position</b> der Werte ab; solange der veränderte Wert auf derselben Seite bleibt, ändert er sich gar nicht oder kaum. Mittelwert, Spannweite und Standardabweichung rechnen dagegen mit den Größen selbst und reagieren stark auf Ausreißer. Deshalb nennt man den Median robust."
      },
      {
        id: 36, level: 6, typ: "numerisch",
        frage: "Zwei Messreihen: A hat \\(\\bar{x} = 50\\) und \\(s = 2\\), B hat \\(\\bar{x} = 200\\) und \\(s = 6\\). Berechne den Variationskoeffizienten \\(\\frac{s}{\\bar{x}}\\) von B in Prozent, um die Streuungen vergleichbar zu machen.",

        tipp: "Setze die Standardabweichung ins Verhältnis zum jeweiligen Mittelwert.",
        loesungsweg: "$$\\frac{s_B}{\\bar{x}_B} = \\frac{6}{200} = 0{,}03 = 3\\,\\%$$ Zum Vergleich: \\(\\frac{2}{50} = 4\\,\\%\\) für A. Obwohl B die größere absolute Streuung hat, ist sie <b>relativ</b> zum Messniveau kleiner – Reihe B misst also gleichmäßiger."
      }


    ];
    </script>
